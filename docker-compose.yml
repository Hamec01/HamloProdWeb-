# HamloProd — self-hosted PostgreSQL (migration phase M1.2a).
#
# Runs on the project's own VPS, NOT on Vercel. The port is published to
# 127.0.0.1 only — the database is never reachable from the network.
#
# Roles (created by prisma/docker/initdb, never superusers except the bootstrap):
#   postgres            bootstrap superuser, local socket only, not used by the app
#   hamloprod_migrator  LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE; owns the DB and
#                       the public schema; runs Prisma migrations (DIRECT_URL)
#   hamloprod_app       LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE; CONNECT + USAGE
#                       + DML only, cannot CREATE/ALTER/DROP (DATABASE_URL)
#
# Persistent data is a REQUIRED bind mount at /home/deploy/app-data/hamloprod/pgdata
# (create it before the first `up`). No named volume.
#
# Usage:
#   mkdir -p /home/deploy/app-data/hamloprod/pgdata
#   cp .env.example .env   # fill POSTGRES_ADMIN_PASSWORD, MIGRATOR_DB_PASSWORD, APP_DB_PASSWORD, *_URL
#   docker compose up -d
#   npm run db:migrate:deploy

name: hamloprod

services:
  postgres:
    image: postgres:16
    container_name: hamloprod-postgres
    restart: unless-stopped
    # Loopback only. Never change to 0.0.0.0 — Docker would bypass the host firewall.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55434}:5432"
    environment:
      # Bootstrap superuser — local socket use only, never in DATABASE_URL/DIRECT_URL.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Least-privilege roles + the application database, created by the init script.
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER:-hamloprod_migrator}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set MIGRATOR_DB_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-hamloprod_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      APP_DB_NAME: hamloprod
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - "-c"
      - "max_connections=40"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
    volumes:
      - ./prisma/docker/initdb:/docker-entrypoint-initdb.d:ro
      - /home/deploy/app-data/hamloprod/pgdata:/var/lib/postgresql/data
    mem_limit: 768m
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
