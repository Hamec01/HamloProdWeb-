;; HamloProd — PgBouncer for the Vercel Preview → VPS PostgreSQL link (M1.3).
;;
;; Threat model: Vercel Hobby/Pro functions egress from a wide dynamic IP pool, so
;; there is no usable IP allow-list until Vercel Secure Compute. The endpoint is
;; therefore defended by: a non-standard port, mandatory TLS (client verifies the
;; db.hamloprod.org certificate), SCRAM-SHA-256, a userlist that contains ONLY the
;; least-privilege app role, a bounded connection budget, and fail2ban on the log.
;;
;; Postgres itself is never published off-box; PgBouncer reaches it over the
;; private "hamloprod_default" docker network as host "postgres".

[databases]
;; One entry, one database. auth is taken from [pgbouncer].auth_file (userlist.txt).
hamloprod = host=postgres port=5432 dbname=hamloprod

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; ---- authentication -------------------------------------------------------
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
;; No auth_query: the userlist is static and holds only hamloprod_app. The
;; migrator role is deliberately absent — migrations never traverse the pooler
;; or the public endpoint (see DIRECT_URL in docs/preview-db-connection.md).

;; ---- pooling / connection budget ----------------------------------------
;; Serverless = many short-lived clients. Transaction pooling multiplexes them
;; onto a small, fixed set of server connections. Postgres runs max_connections=40;
;; the pooler is capped well under that so local ops + migrations keep headroom.
pool_mode = transaction
max_client_conn = 100
default_pool_size = 8
min_pool_size = 0
reserve_pool_size = 4
reserve_pool_timeout = 3
server_lifetime = 3600
server_idle_timeout = 240
query_wait_timeout = 15
;; Prisma/other clients send these in the startup packet; harmless to ignore
;; under transaction pooling.
ignore_startup_parameters = extra_float_digits,search_path,options

;; ---- client-side TLS (Vercel Function → PgBouncer) ----------------------
;; require = TLS is mandatory and PgBouncer presents its certificate. Client
;; identity is NOT checked here (no mTLS) — clients authenticate with SCRAM.
;; The client is what pins the server: Prisma uses sslmode=verify-full against
;; the real Let's Encrypt cert for db.hamloprod.org.
client_tls_sslmode = require
client_tls_key_file = /etc/pgbouncer/certs/privkey.pem
client_tls_cert_file = /etc/pgbouncer/certs/fullchain.pem
client_tls_protocols = tlsv1.2,tlsv1.3

;; ---- server-side TLS (PgBouncer → PostgreSQL) --------------------------
;; "prefer": use TLS when the database offers it, don't fail when it doesn't.
;; Traffic here stays on the isolated docker bridge. Switch to "require" (or
;; verify-full + server_tls_ca_file) once Postgres has ssl=on — see
;; deploy/preview-db/postgres-tls.md (Phase 2, required before production).
server_tls_sslmode = prefer

;; ---- admin / observability -------------------------------------------
admin_users = pgbadmin
stats_users = pgbstats
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
;; stderr → `docker logs hamloprod-pgbouncer`; the fail2ban filter reads this.

;; ---- hardening timeouts ---------------------------------------------
server_connect_timeout = 10
client_login_timeout = 15
tcp_keepalive = 1
