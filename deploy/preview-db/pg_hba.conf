# HamloProd PostgreSQL host-based auth — TLS-only for every non-local client.
# Installed into the data dir (see deploy/preview-db/postgres-tls.md). Reload with
# `docker exec hamloprod-postgres psql -U postgres -c "SELECT pg_reload_conf()"`.
#
# The PgBouncer→PostgreSQL hop is the only non-local path and it MUST be TLS:
# `hostssl` matches, plain `host` does not, so `sslmode=disable` is refused.
#
# `local ... trust` keeps `docker exec … psql` and the init scripts working on the
# unix socket. The 127.0.0.1 loopback publish (127.0.0.1:55434, used only by
# `DIRECT_URL` for `prisma migrate deploy` run on this same VPS) stays plain
# scram — it is loopback on one host, not network-reachable, and forcing TLS
# there would need the migrator to pin the internal CA for no security gain.

# TYPE   DATABASE   USER                 ADDRESS          METHOD
local    all        all                                   trust
host     all        all                  127.0.0.1/32     scram-sha-256
host     all        all                  ::1/128          scram-sha-256

# PgBouncer container on hamloprod_default — TLS required (pin the exact subnet
# with:  docker network inspect hamloprod_default -f '{{(index .IPAM.Config 0).Subnet}}')
hostssl  all        all                  172.25.0.0/16    scram-sha-256

# no trailing `host all all all …` — anything else is refused
