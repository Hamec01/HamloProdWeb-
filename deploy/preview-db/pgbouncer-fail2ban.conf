[Definition]
# Docker json-file envelope. Count one ERROR per failed password, not the
# accompanying LOG/WARNING lines. Anchor the peer before the error text.
datepattern = %%Y-%%m-%%d %%H:%%M:%%S\.%%f UTC
failregex = ^\{"log":"\s*\[\d+\] ERROR C-[0-9a-fx]+: [^\s@\\]+/[^\s@\\]+@<HOST>:\d+ password authentication failed\\n","stream":"stderr","time":"[^"]+"\}\s*$
ignoreregex =
